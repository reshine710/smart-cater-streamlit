# ===================================
# 本地開發測試配置
# ===================================
# HTTP Only（不使用 SSL）

# 上游服務定義
upstream streamlit_backend {
    server streamlit_app:8080;
}

# ===================================
# HTTP - Streamlit 儀表板（本地測試）
# ===================================
server {
    listen 80;
    server_name localhost;

    # 增加客戶端請求大小限制
    client_max_body_size 20M;

    # 訪問日誌
    access_log /var/log/nginx/streamlit_access.log;
    error_log /var/log/nginx/streamlit_error.log;

    # Streamlit 應用代理
    location / {
        proxy_pass http://streamlit_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支援（Streamlit 必需）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超時設定
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # 緩衝設定
        proxy_buffering off;
    }

    # Streamlit 健康檢查端點
    location /_stcore/health {
        proxy_pass http://streamlit_backend/_stcore/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Streamlit 靜態資源
    location /_stcore/static {
        proxy_pass http://streamlit_backend/_stcore/static;
        proxy_set_header Host $host;
        # 快取靜態資源
        expires 1h;
        add_header Cache-Control "public, immutable";
    }
}

