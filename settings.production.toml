[production]
# 生產環境配置
API_URL = "https://your-api-url.com/api/v1"

# MQTT 配置（如果需要）
MQTT_BROKER_HOST = "your-mqtt-broker.com"
MQTT_BROKER_PORT = 8883
MQTT_USE_TLS = true
MQTT_USERNAME = "your-mqtt-username"
MQTT_PASSWORD = "your-mqtt-password"
MQTT_CLIENT_ID = "smartcater_cloud_frontend"

# 日誌配置
LOG_LEVEL = "INFO"
