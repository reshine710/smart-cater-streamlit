# ===================================
# SmartCater 單一網域配置
# ===================================
# 網域: sihai.baimeng.co
# 前端: / (根路徑)
# 後端 API: /api/v1/

# 上游服務定義
upstream streamlit_backend {
    server smartcater_streamlit:8080;
}

upstream api_backend {
    server smartcater_api:8000;
}

# ===================================
# HTTP 配置 - 重定向到 HTTPS
# ===================================
server {
    listen 80;
    server_name sihai.baimeng.co;
    
    # Let's Encrypt 驗證路徑
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # 其他請求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===================================
# HTTPS - 單一網域配置
# ===================================
server {
    listen 443 ssl http2;
    server_name sihai.baimeng.co;
    
    # SSL 憑證配置
    ssl_certificate /etc/letsencrypt/live/sihai.baimeng.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sihai.baimeng.co/privkey.pem;
    
    # SSL 安全設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # 安全標頭
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 客戶端請求大小限制
    client_max_body_size 20M;
    
    # 日誌
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # ===================================
    # 後端 API 路由 (優先匹配)
    # ===================================
    location /api/ {
        # 代理到後端 API
        proxy_pass http://api_backend;
        
        # 基本代理標頭
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超時設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # API 健康檢查
    location /health {
        proxy_pass http://api_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # ===================================
    # Streamlit 前端 (根路徑和其他路徑)
    # ===================================
    location / {
        # 代理到 Streamlit
        proxy_pass http://streamlit_backend;
        
        # 基本代理標頭
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支援（Streamlit 必需）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超時設定
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # 緩衝設定
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Streamlit 健康檢查
    location /_stcore/health {
        proxy_pass http://streamlit_backend/_stcore/health;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # Streamlit 靜態資源
    location /_stcore/static {
        proxy_pass http://streamlit_backend/_stcore/static;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }
    
    # Streamlit WebSocket
    location /_stcore/stream {
        proxy_pass http://streamlit_backend/_stcore/stream;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

