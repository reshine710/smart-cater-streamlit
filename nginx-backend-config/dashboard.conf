# ===================================
# Streamlit Dashboard 配置
# ===================================
# 此文件應放置在後端專案的 nginx 配置目錄中
# 例如：/path/to/backend/nginx/dashboard.conf

# 上游服務定義 - Streamlit 前端
upstream streamlit_backend {
    # 容器名稱：smartcater_streamlit
    server smartcater_streamlit:8080;
    
    # 健康檢查（Nginx Plus 功能）
    # check interval=3000 rise=2 fall=3 timeout=1000;
}

# ===================================
# HTTP 配置 - 重定向到 HTTPS
# ===================================
server {
    listen 80;
    server_name dashboard.*;
    
    # 支援任何 hostname，例如：
    # - dashboard.example.com
    # - dashboard.localhost
    # - dashboard.192.168.1.100.nip.io
    
    # Let's Encrypt 驗證路徑
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # 其他請求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===================================
# HTTPS - Streamlit 儀表板
# ===================================
server {
    listen 443 ssl http2;
    server_name dashboard.*;
    
    # SSL 憑證配置
    # 注意：使用萬用字元憑證或為 dashboard 子網域單獨申請憑證
    ssl_certificate /etc/letsencrypt/live/dashboard.sihai.baimeng.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.sihai.baimeng.co/privkey.pem;
    
    # 如果使用通配符憑證
    # ssl_certificate /etc/letsencrypt/live/sihai.baimeng.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sihai.baimeng.co/privkey.pem;
    
    # SSL 安全設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # SSL Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # 安全標頭
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # 客戶端請求大小限制
    client_max_body_size 20M;
    
    # 日誌
    access_log /var/log/nginx/dashboard_access.log;
    error_log /var/log/nginx/dashboard_error.log;
    
    # ===================================
    # Streamlit 應用代理
    # ===================================
    location / {
        proxy_pass http://streamlit_backend;
        
        # 基本代理標頭
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # WebSocket 支援（Streamlit 必需）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超時設定（Streamlit 需要較長的超時時間）
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # 緩衝設定
        proxy_buffering off;
        proxy_request_buffering off;
        
        # 重定向處理
        proxy_redirect off;
    }
    
    # ===================================
    # Streamlit 健康檢查端點
    # ===================================
    location /_stcore/health {
        proxy_pass http://streamlit_backend/_stcore/health;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # ===================================
    # Streamlit 靜態資源（可選優化）
    # ===================================
    location /_stcore/static {
        proxy_pass http://streamlit_backend/_stcore/static;
        proxy_set_header Host $host;
        
        # 快取靜態資源
        expires 1h;
        add_header Cache-Control "public, immutable";
    }
    
    # ===================================
    # Streamlit WebSocket 端點
    # ===================================
    location /_stcore/stream {
        proxy_pass http://streamlit_backend/_stcore/stream;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 需要更長的超時
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ===================================
# 配置說明
# ===================================
# 1. 將此文件複製到後端專案的 nginx 配置目錄
# 2. 在後端的 docker-compose 中掛載此配置：
#    volumes:
#      - ./nginx/dashboard.conf:/etc/nginx/conf.d/dashboard.conf:ro
# 3. 申請 SSL 憑證：
#    docker run --rm -v "./certbot/conf:/etc/letsencrypt" \
#      -v "./certbot/www:/var/www/certbot" \
#      certbot/certbot certonly --webroot \
#      -w /var/www/certbot \
#      -d dashboard.sihai.baimeng.co \
#      --email admin@sihai.baimeng.co \
#      --agree-tos
# 4. 重新載入 Nginx：
#    docker-compose exec nginx nginx -s reload

