version: '3.8'

# ===================================
# SmartCater Streamlit Frontend
# 生產環境配置
# ===================================
# 注意：此配置假設後端服務已經在運行
# 前端將加入後端的 smartcater_network 網路

services:
  # ===================================
  # Streamlit 智慧販賣機管理系統
  # ===================================
  streamlit_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartcater_streamlit:prod
    container_name: smartcater_streamlit
    restart: unless-stopped
    environment:
      # 環境切換：production 使用生產環境配置
      - ENV_FOR_DYNACONF=production
      
      # API 配置：透過 Nginx 訪問後端 API（推薦）
      # Streamlit 是服務器端應用，需要完整 URL
      - DYNACONF_API_URL=http://api:8000/api/v1
      - DYNACONF_DB_HOST=host.docker.internal
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - POSTGRES_USER=smartcater_prod
      - POSTGRES_DB=smartcater_prod_db
      
      # MQTT 配置：連接到後端的 EMQX
      - MQTT_BROKER_HOST=smartcater_emqx
      - MQTT_BROKER_PORT=1883
      - MQTT_USE_TLS=false
      - MQTT_CLIENT_ID=smartcater_streamlit_frontend
      
      # 日誌配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - .env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"  
    volumes:
      # 持久化日誌文件
      - ./logs:/app/logs
      
      # 生產配置文件（只讀）
      - ./settings.production.toml:/app/settings.production.toml:ro
      
    networks:
      # 加入後端的網路（外部網路）
      - smartcater_network
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        
    # 資源限制
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

# ===================================
# 網路配置
# ===================================
networks:
  smartcater_network:
    # 使用後端已創建的外部網路
    # 注意：實際網路名稱為 v031_smartcater_network
    external: true
    name: v031_smartcater_network

# 注意事項：
# 1. 此配置不包含 Nginx 和 Certbot，因為後端已經有了
# 2. Streamlit 服務會加入後端的 smartcater_network
# 3. 後端的 Nginx 需要配置單一網域路由：
#    - / → Streamlit 前端
#    - /api/ → 後端 API
# 4. 使用相對路徑 /api/v1 訪問 API（單一網域方案）
# 5. 確保後端服務已經啟動並且網路已創建
